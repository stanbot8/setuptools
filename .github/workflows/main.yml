name: tests

on:
  merge_group:
  push:
    branches-ignore:
    # temporary GH branches relating to merge queues (jaraco/skeleton#93)
    - gh-readonly-queue/**
    tags:
    # required if branches-ignore is supplied (jaraco/skeleton#103)
    - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: |-
    ${{ github.workflow }}- ${{ github.ref_type }}- ${{ github.event.pull_request.number || ((github.event_name == 'schedule' || github.event_name == 'workflow_run') && '4e612f9e44ecfad130d0b2a27a2dce0740599b4b' || github.sha) }}
  cancel-in-progress: ${{ (github.event_name == 'workflow_dispatch' || 
    github.run_attempt > 1) && (true) }}

permissions:
  contents: read

jobs:
  test:
    strategy:
      # https://blog.jaraco.com/efficient-use-of-ci-resources/
      matrix:
        python:
        - "3.10"
        - "3.14"
        - "3.14t"
        platform:
        - ubuntu-latest
        - macos-latest
        - windows-latest
        include:
        - python: "3.11"
          platform: ubuntu-latest
        - python: "3.12"
          platform: ubuntu-latest
        - python: "3.13"
          platform: ubuntu-latest
        # Disabled: cffi (required by PyNaCl) doesn't support free-threaded CPython 3.13t.
        # - python: "3.13t"
        #   platform: ubuntu-latest
        - python: "3.15"
          platform: ubuntu-latest
        - python: pypy3.11
          platform: ubuntu-latest
          distutils: stdlib
        - platform: ubuntu-latest
          python: "3.10"
          distutils: stdlib
    uses: ./.github/workflows/test-suite.yml
    with:
      job: ${{ github.job }}
      python: ${{ matrix.python }}
      platform: ${{ matrix.platform }}
      distutils: ${{ matrix.distutils }}
      full-test: true
    secrets: inherit

    needs:
    - alpha_bridge_inputs
    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  collateral:
    strategy:
      fail-fast: false
      matrix:
        job:
        - diffcov
        - docs
    uses: ./.github/workflows/test-suite.yml
    with:
      platform: ubuntu-latest
      tox-env: ${{ matrix.job }}

    needs:
    - alpha_bridge_inputs
    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  check:  # This job does nothing and is only used for the branch protection
    if: |-
      ${{ (always()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}


    needs:
    - check-changed-folders
    - integration-test
    - test
    - collateral
    - test_cygwin
    - alpha_bridge_inputs
    runs-on: ubuntu-latest

    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@release/v1
      with:
        allowed-skips: check-changed-folders, integration-test
        jobs: ${{ toJSON(needs) }}

  test_cygwin:
    strategy:
      matrix:
        python:
        - 312
        platform:
        - windows-latest
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 75
    # Decoupled from the reusable test-suite.yml (Cygwin needs its own shell);
    # env vars shared with that workflow are duplicated here deliberately.
    env:
      FORCE_COLOR: 1
      PIP_DISABLE_PIP_VERSION_CHECK: 'true'
      PIP_NO_WARN_SCRIPT_LOCATION: 'true'
      TOX_OVERRIDE: >-
        testenv.pass_env+=GITHUB_*,FORCE_COLOR
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ (github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && '4e612f9e44ecfad130d0b2a27a2dce0740599b4b' || 
          github.sha }}
    - name: Install Cygwin with Python
      uses: cygwin/cygwin-install-action@v4
      with:
        platform: x86_64
        packages: >-
          python${{ matrix.python }},
          python${{ matrix.python }}-devel,
          python${{ matrix.python }}-pip,
          gcc-core,
          git,
    - name: Record the currently selected Python version
      id: python-install
        # NOTE: This roughly emulates what `actions/setup-python` provides
        # NOTE: except the action gets the version from the installation path
        # NOTE: on disk and we get it from runtime.
      run: |
        python -c 'import platform; print("python-version=" + platform.python_version())' >> ${GITHUB_OUTPUT}
      shell: C:\cygwin\bin\env.exe CYGWIN_NOWINPATH=1 CHERE_INVOKING=1 
        C:\cygwin\bin\bash.exe -leo pipefail -o igncr {0}
    - name: Install tox using pip
      shell: C:\cygwin\bin\env.exe CYGWIN_NOWINPATH=1 CHERE_INVOKING=1 
        C:\cygwin\bin\bash.exe -leo pipefail -o igncr {0}
      run: |
        # Workaround for https://github.com/pypa/setuptools/issues/4831
        python -m pip install tox
    - name: Run tests
      shell: C:\cygwin\bin\env.exe CYGWIN_NOWINPATH=1 CHERE_INVOKING=1 
        C:\cygwin\bin\bash.exe -leo pipefail -o igncr {0}
      run: |
        git config --global --add safe.directory "$(cygpath -u "${{ github.workspace }}")" # workaround for #3408
        echo "$(cygpath -u "${{ github.workspace }}")" # for debugging purposes
        python -m tox
    - name: Create coverage report
      if: hashFiles('.coverage') != ''    # Rudimentary `file.exists()`
      run: |
        python -m pip install coverage
        python -m coverage xml --ignore-errors
      shell: C:\cygwin\bin\env.exe CYGWIN_NOWINPATH=1 CHERE_INVOKING=1 
        C:\cygwin\bin\bash.exe -leo pipefail -o igncr {0}
    - name: Publish coverage
      if: hashFiles('coverage.xml') != ''    # Rudimentary `file.exists()`
      uses: codecov/codecov-action@v4
      with:
        flags: >-  # Mark which lines are covered by which envs
          CI-GHA,
          ${{ github.job }},
          OS-${{ runner.os }},
          VM-${{ matrix.platform }},
          Py-${{ steps.python-install.outputs.python-version }}
        token: ${{ secrets.CODECOV_TOKEN }}

    needs:
    - alpha_bridge_inputs
    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  check-changed-folders:
    name: Fail the job if files changed under _disutils/_vendor folders
    if: |-
      ${{ (github.event_name == 'pull_request') && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        ref: ${{ (github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && '4e612f9e44ecfad130d0b2a27a2dce0740599b4b' || 
          github.sha }}
    - name: Check if files changed in the _distutils folder
      id: changed-files-specific-distutils
      uses: tj-actions/changed-files@v46
      with:
        files: |
          setuptools/_distutils/**
    - name: Check if files changed in the _vendor folder
      id: changed-files-specific-vendor
      uses: tj-actions/changed-files@v46
      with:
        files: |
          setuptools/_vendor/**
    - name: Fail the job if any file(s) in the _distutils folder change
      if: steps.changed-files-specific-distutils.outputs.any_changed == 'true'
      run: |
        echo "One or more files in the setuptools/_distutils folder has changed." | tee "${GITHUB_STEP_SUMMARY}"
        exit 1
    - name: Fail the job if any file(s) in the _vendor folder change
      if: steps.changed-files-specific-vendor.outputs.any_changed == 'true'
      run: |
        echo "One or more files in the setuptools/_vendor folder has changed." | tee "${GITHUB_STEP_SUMMARY}"
        exit 1

    needs:
    - alpha_bridge_inputs
  integration-test:
    needs:
    - test
    - alpha_bridge_inputs
    if: |-
      ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(((github.event_name == 'schedule' || github.event_name == 'workflow_run') && 'refs/heads/main' || github.ref), 'refs/tags/'))) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}

    # To avoid long times and high resource usage, we assume that:
    # 1. The setuptools APIs used by packages don't vary too much with OS or
    #    Python implementation
    # 2. Any circumstance for which the previous assumption is not valid is
    #    already tested via unit tests (or other tests not classified here as
    #    "integration")
    # With that in mind, the integration tests can run for a single setup
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Decoupled from the reusable test-suite.yml; env vars shared with that
    # workflow are duplicated here deliberately.
    env:
      FORCE_COLOR: 1
      PIP_DISABLE_PIP_VERSION_CHECK: 'true'
      PIP_NO_WARN_SCRIPT_LOCATION: 'true'
      TOX_OVERRIDE: >-
        testenv.pass_env+=GITHUB_*,FORCE_COLOR
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ (github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && '4e612f9e44ecfad130d0b2a27a2dce0740599b4b' || 
          github.sha }}
    - name: Install OS-level dependencies
      run: |
        sudo apt-get update
        sudo apt-get install build-essential gfortran libopenblas-dev libyaml-dev
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
          # Use a release that is not very new but still have a long life:
        python-version: "3.10"
    - name: Install tox
      run: |
        python -m pip install tox
    - name: Run integration tests
      run: |-
        tox -e integration


  release:
    permissions:
      contents: write
    needs:
    - check
    - alpha_bridge_inputs
    if: |-  # `always()` prevents auto-cancellation when previous steps are skipped (#5151):
      ${{ (always() && needs.check.result == 'success' && github.event_name == 'push' && github.ref_type == 'tag') && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ (github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && '4e612f9e44ecfad130d0b2a27a2dce0740599b4b' || 
          github.sha }}
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.x
    - name: Install tox
      run: |-
        python -m pip install tox
    - name: Run
      run: |-
        tox -e release
      env:
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  alpha_bridge_inputs:
    name: CI input check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: alpha-bridge-inputs-${{ github.workflow }}-${{ github.sha }}-${{ 
        github.event.schedule || github.event_name }}
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.identity.outputs.changed }}
    steps:
    - id: identity
      name: Check source, workflow, variables, and runner inputs
      env:
        GH_TOKEN: ${{ github.token }}
        AB_REPOSITORY: ${{ github.repository }}
        AB_RUN_ID: ${{ github.run_id }}
        AB_HEAD_SHA: ${{ (github.event_name == 'schedule' || github.event_name 
          == 'workflow_run') && '4e612f9e44ecfad130d0b2a27a2dce0740599b4b' || 
          github.sha }}
        AB_REF: ${{ (github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && 'refs/heads/main' || github.ref }}
        AB_WORKFLOW_DIGEST: 
          551e38ecfc95099a1685cd517b0f05b109e4c9c19b7cf8c2bfa6cc8cf276a26f
        AB_EVENT: ${{ github.event_name }}
        AB_SCHEDULE: ${{ github.event.schedule || '' }}
        AB_VARIABLES: ${{ toJSON(vars) }}
        AB_INPUTS: ${{ toJSON(inputs) }}
        AB_WORKFLOW_RUN: ${{ toJSON(github.event.workflow_run) }}
      shell: bash
      run: "python3 - <<'ALPHA_BRIDGE_CI_PY'\n\"\"\"Native automatic-CI input check,
        embedded in the owned fork configuration.\"\"\"\n\nfrom __future__ import
        annotations\n\nimport base64\nimport hashlib\nimport json\nimport os\nimport
        re\nimport urllib.parse\nimport urllib.request\n\nINPUT_CHECK_NAMES = (\"\
        CI input check\", \"AlphaBridge input check\")\nINPUT_IDENTITY_PREFIXES =
        (\"CI input identity \", \"AlphaBridge input identity \")\n\n\ndef input_identity(job):\n\
        \    for step in job.get(\"steps\", []):\n        if step.get(\"conclusion\"\
        ) != \"success\":\n            continue\n        name = step.get(\"name\"\
        , \"\")\n        for prefix in INPUT_IDENTITY_PREFIXES:\n            if name.startswith(prefix):\n\
        \                identity = name.removeprefix(prefix)\n                if
        re.fullmatch(r\"[0-9a-f]{64}\", identity):\n                    return identity\n\
        \    return \"\"\n\n\ndef parent_has_work(get, repository, parent):\n    if
        (\n        not parent\n        or parent.get(\"head_branch\") != \"alpha-bridge-ci\"\
        \n        or parent.get(\"status\") != \"completed\"\n    ):\n        return
        True\n    sha = parent[\"head_sha\"]\n    if re.fullmatch(r\"[0-9a-f]{40}\"\
        , sha) is None:\n        raise ValueError(\"parent workflow has no exact configuration
        commit\")\n    record = get(f\"/repos/{repository}\")\n    marker_file = get(f\"\
        /repos/{repository}/contents/.github/alpha-bridge-ci.json?ref={sha}\")\n \
        \   marker = json.loads(base64.b64decode(marker_file[\"content\"]))\n    if
        (\n        record.get(\"fork\") is not True\n        or marker.get(\"schema\"\
        ) != \"alpha-bridge/fork-ci\"\n        or marker.get(\"source_repository\"\
        ) != record.get(\"parent\", {}).get(\"full_name\")\n    ):\n        raise
        ValueError(\"parent CI configuration has no verified fork ownership\")\n \
        \   path = parent[\"path\"].split(\"@\", 1)[0]\n    if not path.startswith(\"\
        .github/workflows/\") or \"/\" in path.removeprefix(\".github/workflows/\"\
        ):\n        raise ValueError(\"parent workflow path is outside its configuration
        owner\")\n    definition = get(f\"/repos/{repository}/contents/{urllib.parse.quote(path,
        safe='/')}?ref={sha}\")\n    if hashlib.sha256(base64.b64decode(definition[\"\
        content\"])).hexdigest() != marker.get(\n        \"definition_sha256\", {}\n\
        \    ).get(path):\n        raise ValueError(\"parent workflow differs from
        its owned definition\")\n    if path == \".github/workflows/alpha-bridge-ci-verify.yml\"\
        :\n        return False\n    jobs = []\n    page = 1\n    while True:\n  \
        \      values = get(\n            f\"/repos/{repository}/actions/runs/{parent['id']}/jobs?per_page=100&page={page}\"\
        \n        )[\"jobs\"]\n        jobs.extend(values)\n        if len(values)
        < 100:\n            break\n        page += 1\n    guards = [\n        job\n\
        \        for job in jobs\n        if job.get(\"name\") in INPUT_CHECK_NAMES\n\
        \        and job.get(\"conclusion\") == \"success\"\n        and input_identity(job)\n\
        \    ]\n    return not guards or any(\n        job not in guards and job.get(\"\
        conclusion\") != \"skipped\" for job in jobs\n    )\n\n\ndef changed(get,
        *, repository, run_id, identity, job_name):\n    current = get(f\"/repos/{repository}/actions/runs/{run_id}\"\
        )\n    event = current[\"event\"]\n    page = 1\n    while True:\n       \
        \ # Filter locally: GitHub caps filtered searches at 1,000 results.\n    \
        \    query = urllib.parse.urlencode({\"per_page\": 100, \"page\": page})\n\
        \        runs = get(f\"/repos/{repository}/actions/workflows/{current['workflow_id']}/runs?{query}\"\
        )\n        for run in runs[\"workflow_runs\"]:\n            if run[\"id\"\
        ] == run_id:\n                continue\n            if run.get(\"head_branch\"\
        ) != current[\"head_branch\"] or run.get(\"event\") != event:\n          \
        \      continue\n            job_page = 1\n            while True:\n     \
        \           jobs = get(\n                    f\"/repos/{repository}/actions/runs/{run['id']}/jobs?per_page=100&page={job_page}\"\
        \n                )[\"jobs\"]\n                for job in jobs:\n        \
        \            if (\n                        (\n                           \
        \ job[\"name\"] in INPUT_CHECK_NAMES\n                            if job_name
        in INPUT_CHECK_NAMES\n                            else job[\"name\"] == job_name\n\
        \                        )\n                        and job.get(\"status\"\
        ) == \"completed\"\n                        and job.get(\"conclusion\") ==
        \"success\"\n                        and input_identity(job) == identity\n\
        \                    ):\n                        return False\n          \
        \      if len(jobs) < 100:\n                    break\n                job_page
        += 1\n        if len(runs[\"workflow_runs\"]) < 100:\n            return True\n\
        \        page += 1\n\n\ndef main():\n    event = os.environ[\"AB_EVENT\"]\n\
        \    event_payload = None\n    if event not in {\"schedule\", \"workflow_run\"\
        }:\n        with open(os.environ[\"GITHUB_EVENT_PATH\"], encoding=\"utf-8\"\
        ) as payload_file:\n            event_payload = json.load(payload_file)\n\
        \    inputs = {\n        \"source_commit\": os.environ[\"AB_HEAD_SHA\"],\n\
        \        \"source_ref\": os.environ[\"AB_REF\"],\n        \"workflow_definition\"\
        : os.environ[\"AB_WORKFLOW_DIGEST\"],\n        \"event\": event,\n       \
        \ \"event_payload\": event_payload,\n        \"schedule\": os.environ[\"AB_SCHEDULE\"\
        ],\n        \"variables\": json.loads(os.environ[\"AB_VARIABLES\"]),\n   \
        \     \"inputs\": json.loads(os.environ[\"AB_INPUTS\"]),\n        \"runner_image\"\
        : [os.environ.get(\"ImageOS\", \"\"), os.environ.get(\"ImageVersion\", \"\"\
        )],\n        \"producer\": json.loads(os.environ.get(\"AB_WORKFLOW_RUN\",
        \"null\")),\n    }\n    identity = hashlib.sha256(json.dumps(inputs, sort_keys=True).encode()).hexdigest()\n\
        \n    def get(path):\n        request = urllib.request.Request(\n        \
        \    \"https://api.github.com\" + path,\n            headers={\n         \
        \       \"Authorization\": \"Bearer \" + os.environ[\"GH_TOKEN\"],\n     \
        \           \"Accept\": \"application/vnd.github+json\",\n               \
        \ \"X-GitHub-Api-Version\": \"2026-03-10\",\n            },\n        )\n \
        \       with urllib.request.urlopen(request, timeout=60) as response:\n  \
        \          return json.load(response)\n\n    manual = event == \"workflow_dispatch\"\
        \ or int(os.environ[\"GITHUB_RUN_ATTEMPT\"]) > 1\n    should_run = manual
        or (\n        (\n            inputs[\"event\"] != \"workflow_run\"\n     \
        \       or parent_has_work(get, os.environ[\"AB_REPOSITORY\"], inputs[\"producer\"\
        ])\n        )\n        and changed(\n            get,\n            repository=os.environ[\"\
        AB_REPOSITORY\"],\n            run_id=int(os.environ[\"AB_RUN_ID\"]),\n  \
        \          identity=identity,\n            job_name=\"CI input check\",\n\
        \        )\n    )\n    with open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"\
        utf-8\") as output:\n        output.write(f\"digest={identity}\\nchanged={str(should_run).lower()}\\\
        n\")\n    print(\n        \"Explicit CI run requested\"\n        if manual\n\
        \        else \"CI inputs changed\"\n        if should_run\n        else \"\
        CI inputs unchanged; build and test jobs skipped\"\n    )\n\n\nif __name__
        == \"__main__\":\n    main()\n\nALPHA_BRIDGE_CI_PY\n"
    - name: CI input identity ${{ steps.identity.outputs.digest }}
      run: echo 'Input identity recorded'
